<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Etch Halftone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #1e1e1e; color: #e0e0e0; font-family: sans-serif; overflow: hidden; margin: 0; }
        .plugin-container { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
        input[type=range] { accent-color: #00d084; width: 70%; cursor: pointer; }
        button { cursor: pointer; transition: 0.2s; }
        button:hover { background: #444 !important; border-color: #555 !important; }
        .shape-btn.active { border-color: #00d084 !important; color: #00d084 !important; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        label { font-size: 9px; font-weight: bold; color: #aaa; display: block; margin-bottom: 4px; text-transform: uppercase; }
        span.value-display { font-size: 10px; color: #00d084; min-width: 30px; text-align: right; font-weight: bold; }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="header" style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;">
            <h3 style="margin:0; font-size: 11px; color: #888;">ETCH HALFTONE</h3>
            <span class="status" id="status-dot" style="color: #555; font-size: 14px;">●</span>
        </div>

        <div class="controls" style="flex-grow: 1; overflow-y: auto;">
            <label>Shape</label>
            <div class="shape-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px;">
                <button class="shape-btn active" data-shape="circle" style="background: #333; border: 1px solid #444; color: #aaa; padding: 8px; border-radius: 4px;">●</button>
                <button class="shape-btn" data-shape="rect" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; border-radius: 4px;">■</button>
                <button class="shape-btn" data-shape="line" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; border-radius: 4px;">━</button>
                <button class="shape-btn" data-shape="cross" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; border-radius: 4px;">✚</button>
            </div>

            <label>Density (Grid Size)</label>
            <div class="slider-row">
                <input type="range" id="density" min="5" max="50" value="12">
                <span id="val-density" class="value-display">12px</span>
            </div>

            <label>Max Size</label>
            <div class="slider-row">
                <input type="range" id="size" min="0.1" max="1.5" step="0.1" value="1.0">
                <span id="val-size" class="value-display">1.0x</span>
            </div>

            <label>Angle</label>
            <div class="slider-row">
                <input type="range" id="angle" min="0" max="90" value="0">
                <span id="val-angle" class="value-display">0°</span>
            </div>

            <div id="selection-msg" style="font-size: 10px; color: #666; text-align: center; margin-top: 20px;">
                Select an image on board
            </div>
        </div>

        <button id="btn-generate" disabled style="background: #00d084; color: #000; border: none; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 12px; opacity: 0.3; width: 100%;">GENERATE VECTOR</button>
    </div>

    <script src="src/engine.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
