<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Etch Halftone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #1e1e1e; color: #e0e0e0; font-family: sans-serif; overflow: hidden; margin: 0; }
        .plugin-container { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
        input[type=range] { accent-color: #00d084; width: 70%; }
        button:hover { background: #444 !important; border-color: #555 !important; }
        .shape-btn.active { border-color: #00d084 !important; color: #00d084 !important; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        label { font-size: 9px; font-weight: bold; color: #aaa; display: block; margin-bottom: 4px; text-transform: uppercase; }
        span.value-display { font-size: 10px; color: #00d084; min-width: 30px; text-align: right; }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="header" style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;">
            <h3 style="margin:0; font-size: 11px; color: #888;">ETCH HALFTONE</h3>
            <span class="status" id="status-dot" style="color: #555;">●</span>
        </div>

        <div class="controls" style="flex-grow: 1; overflow-y: auto;">
            <label>Shape</label>
            <div class="shape-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px;">
                <button class="shape-btn active" data-shape="circle" style="background: #333; border: 1px solid #444; color: #aaa; padding: 8px; cursor: pointer; border-radius: 4px;">●</button>
                <button class="shape-btn" data-shape="rect" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; cursor: pointer; border-radius: 4px;">■</button>
                <button class="shape-btn" data-shape="line" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; cursor: pointer; border-radius: 4px;">━</button>
                <button class="shape-btn" data-shape="cross" style="background: #252525; border: 1px solid #333; color: #aaa; padding: 8px; cursor: pointer; border-radius: 4px;">✚</button>
            </div>
